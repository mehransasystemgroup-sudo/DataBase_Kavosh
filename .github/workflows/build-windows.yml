name: ساخت نسخهٔ ویندوز

# نسخهٔ نصب‌شونده روی خودِ ویندوز ساخته می‌شود، نه با شبیه‌ساز: هم بوت‌لودر
# اصلی PyInstaller به کار می‌رود، هم NSIS واقعی، و هم نصب و اجرا و حذف
# آزمایشی روی همان سیستم‌عاملی که کاربر نهایی دارد.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "برچسب انتشار — پرش کنید تا فقط ساخته و آزموده شود بدون انتشار"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ساخت رابط کاربری
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: نصب وابستگی‌های ساخت
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller==6.11.1

      - name: بسته‌بندی برنامه
        run: pyinstaller packaging/kavosh.spec --noconfirm

      - name: آزمون دود روی خودِ ویندوز
        shell: pwsh
        run: |
          # برنامه باید بالا بیاید، رابط کاربری و API را سرو کند و پاسخ درست بدهد.
          $env:KAVOSH_NO_BROWSER = "1"
          $env:KAVOSH_DATA_DIR = "$env:RUNNER_TEMP\kavosh-smoke"
          $env:KAVOSH_NO_PAUSE = "1"
          $app = Start-Process -FilePath "dist\KavoshDB\KavoshDB.exe" -PassThru

          $base = "http://127.0.0.1:8321"
          $ready = $false
          foreach ($i in 1..90) {
              Start-Sleep -Seconds 2
              try {
                  Invoke-RestMethod "$base/api/health" -TimeoutSec 3 | Out-Null
                  $ready = $true; break
              } catch { }
          }
          if (-not $ready) { $app | Stop-Process -Force; throw "برنامه بالا نیامد." }

          $health = Invoke-RestMethod "$base/api/health"
          if ([int]$health.kb.tables -lt 3000) { throw "ایندکس ناقص است: $($health.kb.tables) جدول" }

          $checks = @{
              "رابط کاربری" = "$base/"
              "اسکیماها"    = "$base/api/schemas"
              "جزئیات جدول" = "$base/api/table/FIN3.Voucher"
              "گراف اسکیما" = "$base/api/schema/ACC/graph"
              "مسیر JOIN"   = "$base/api/joinpath?source=FIN3.Voucher&target=FIN3.Account"
          }
          foreach ($name in $checks.Keys) {
              $code = (Invoke-WebRequest $checks[$name] -UseBasicParsing -TimeoutSec 10).StatusCode
              if ($code -ne 200) { throw "$name پاسخ $code داد." }
              Write-Host "  ✔ $name"
          }

          $app | Stop-Process -Force
          Write-Host "آزمون دود با موفقیت گذشت — $($health.kb.tables) جدول"

      - name: ساخت نصب‌کننده
        shell: pwsh
        run: |
          # NSIS روی ایمیج ویندوزی گیت‌هاب از پیش نصب است؛ اگر روزی نبود، نصبش
          # می‌کنیم تا گردش‌کار به‌خاطر تغییر ایمیج نشکند.
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
              choco install nsis --no-progress -y
          }
          & $makensis /V2 packaging\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "ساخت نصب‌کننده شکست خورد." }

      - name: آزمون نصب و حذف روی خودِ ویندوز
        shell: pwsh
        run: |
          # آنچه اینجا سنجیده می‌شود، خودِ نصب‌کننده است: نصب بی‌صدا، اجرای
          # برنامه از مسیر نصب‌شده، و حذف کامل بدون آنکه دانش کاربر پاک شود.
          $setup = Get-Item packaging\KavoshDB-Setup-*.exe
          $dir   = "$env:LOCALAPPDATA\Programs\DataBase Kavosh"

          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          if (-not (Test-Path "$dir\KavoshDB.exe")) { throw "نصب انجام نشد." }

          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DataBase Kavosh"
          if (-not (Test-Path $shortcut)) { throw "میان‌بر منوی شروع ساخته نشد." }

          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DataBaseKavosh"
          if (-not (Test-Path $key)) { throw "برنامه در فهرست حذف ویندوز ثبت نشد." }

          if (-not (Test-Path "$dir\diagnose.cmd")) { throw "ابزار تشخیص نصب نشد." }
          $diag = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DataBase Kavosh\تشخیص مشکل.lnk"
          if (-not (Test-Path $diag)) { throw "میان‌بر تشخیص ساخته نشد." }

          $env:KAVOSH_NO_BROWSER = "1"
          # در اجرای خودکار، پنجرهٔ خطا و مکثِ کنسول باید خاموش باشند وگرنه
          # یک شکست به‌جای گزارش‌شدن، تا سقف زمانی آزمون معطل می‌کند.
          $env:KAVOSH_NO_PAUSE = "1"
          $app = Start-Process -FilePath "$dir\KavoshDB.exe" -PassThru
          $ready = $false
          foreach ($i in 1..90) {
              Start-Sleep -Seconds 2
              try { Invoke-RestMethod "http://127.0.0.1:8321/api/health" -TimeoutSec 3 | Out-Null; $ready = $true; break } catch { }
          }
          $app | Stop-Process -Force
          if (-not $ready) { throw "نسخهٔ نصب‌شده بالا نیامد." }

          # دانش کاربر باید از حذف برنامه جان سالم به در ببرد
          $data = "$env:LOCALAPPDATA\KavoshDB"
          if (-not (Test-Path $data)) { throw "پوشهٔ دادهٔ کاربر ساخته نشد." }

          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\KavoshDB.exe") { throw "حذف ناقص بود." }
          if (Test-Path $key)                 { throw "کلید رجیستری باقی ماند." }
          if (-not (Test-Path $data))         { throw "حذف برنامه دانش کاربر را پاک کرد." }

          Write-Host "نصب، اجرا و حذف — هر سه درست"

      # این آزمون از گزارش کاربر آمد: «نسخهٔ ویندوزی بعد از نصب اجرا نمی‌شود».
      # آزمون‌های بالا همیشه روی ماشین تمیز نصب می‌کردند، پس مسیری که کاربر
      # واقعاً می‌رود — نصب نسخهٔ تازه روی نصب قبلیِ *در حال اجرا* — هرگز
      # سنجیده نمی‌شد.
      - name: آزمون نصب روی نسخهٔ قبلیِ در حال اجرا
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:KAVOSH_NO_PAUSE = "1"
          $dir  = "$env:LOCALAPPDATA\Programs\DataBase Kavosh"
          $data = "$env:LOCALAPPDATA\KavoshDB"

          # نصب‌کنندهٔ نسخهٔ پیشین، همان که روی رایانهٔ کاربر بوده
          gh release download V3.0.2 --repo $env:GITHUB_REPOSITORY -p "KavoshDB-Setup-*.exe" -D old
          $oldSetup = (Get-Item old\KavoshDB-Setup-*.exe).FullName

          function Reset-Machine {
              Get-Process KavoshDB -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 2
              Remove-Item $dir  -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          }

          # نسخهٔ قبلی را نصب می‌کند، یک بار اجرا می‌کند تا داده‌اش بنشیند، و
          # آن را *باز* می‌گذارد — دقیقاً وضعیتی که کاربری دارد که برنامه‌اش
          # روی میز باز است و نصب‌کنندهٔ تازه را اجرا می‌کند.
          function Install-OldAndLeaveRunning {
              Start-Process -FilePath $oldSetup -ArgumentList "/S" -Wait
              if (-not (Test-Path "$dir\KavoshDB.exe")) { throw "نصب نسخهٔ قبلی انجام نشد." }
              $p = Start-Process -FilePath "$dir\KavoshDB.exe" -PassThru
              foreach ($i in 1..90) {
                  Start-Sleep -Seconds 2
                  try { Invoke-RestMethod "http://127.0.0.1:8321/api/health" -TimeoutSec 3 | Out-Null; return $p } catch { }
                  if ($p.HasExited) { break }
              }
              throw "نسخهٔ قبلی بالا نیامد؛ آزمون بی‌معنا می‌شود."
          }

          # نصب‌کنندهٔ داده‌شده را روی همان نصبِ باز اجرا می‌کند و می‌گوید آیا
          # برنامه پس از آن بالا می‌آید یا نه — بدون آنکه خودش گام را بیندازد.
          function Test-UpgradeWith($setup, $tag) {
              $code = (Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru).ExitCode
              Write-Host "  نصب‌کنندهٔ $tag با کد $code تمام شد"
              if (-not (Test-Path "$dir\KavoshDB.exe")) {
                  Write-Host "  ✘ $tag — فایل اجرایی سر جایش نیست"
                  return $false
              }
              $log = "$env:RUNNER_TEMP\after-$tag.log"
              # بدون KAVOSH_NO_BROWSER: همان‌طور که کاربر اجرا می‌کند
              $p = Start-Process -FilePath "$dir\KavoshDB.exe" -PassThru `
                   -RedirectStandardOutput $log -RedirectStandardError "$log.err"
              $up = $false
              foreach ($i in 1..60) {
                  Start-Sleep -Seconds 2
                  foreach ($port in 8321..8325) {
                      try { Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2 | Out-Null; $up = $true; break } catch { }
                  }
                  if ($up -or $p.HasExited) { break }
              }
              if (-not $up) {
                  # Out-Host لازم است: هرچه به جریان خروجی برود بخشی از مقدار
                  # بازگشتی تابع می‌شود و $up را به آرایه تبدیل می‌کند.
                  Write-Host "  ── خروجی برنامه ($tag) ──"
                  foreach ($f in @($log, "$log.err")) {
                      if (Test-Path $f) { Get-Content $f | Select-Object -Last 30 | Out-Host }
                  }
                  $err = "$data\logs\startup-error.log"
                  if (Test-Path $err) {
                      Write-Host "  ── گزارش خطای خودِ برنامه ──"
                      Get-Content $err | Select-Object -Last 30 | Out-Host
                  } else {
                      Write-Host "  (برنامه حتی به کد خودش نرسید — گزارش خطایی ننوشت)"
                  }
              }
              if (-not $p.HasExited) { $p | Stop-Process -Force }
              Wait-Process -Id $p.Id -Timeout 30 -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              return $up
          }

          # ── ۱) بازتولید: نصب‌کنندهٔ منتشرشدهٔ ۳.۱.۰، همان که کاربر اجرا کرد ──
          Reset-Machine
          $running = Install-OldAndLeaveRunning
          gh release download V3.1.0 --repo $env:GITHUB_REPOSITORY -p "KavoshDB-Setup-*.exe" -D published
          $publishedOk = Test-UpgradeWith (Get-Item published\KavoshDB-Setup-*.exe).FullName "منتشرشده"

          # ── ۲) همان سناریو با نصب‌کنندهٔ همین ساخت ──
          Reset-Machine
          $running = Install-OldAndLeaveRunning
          $freshOk = Test-UpgradeWith (Get-Item packaging\KavoshDB-Setup-*.exe).FullName "این-ساخت"

          Write-Host ""
          Write-Host "نتیجه — نصب روی نسخهٔ قبلیِ در حال اجرا:"
          Write-Host "  نصب‌کنندهٔ منتشرشده: $(if ($publishedOk) { 'اجرا شد' } else { 'اجرا نشد ← همان چیزی که کاربر دید' })"
          Write-Host "  نصب‌کنندهٔ این ساخت: $(if ($freshOk) { 'اجرا شد' } else { 'اجرا نشد' })"
          if (-not $freshOk) { throw "نصب روی نسخهٔ قبلیِ در حال اجرا، برنامهٔ اجراشدنی تحویل نداد." }

      # این آزمون به‌خاطر ایرادی اضافه شد که به دست کاربر رسید: آزمون‌ها همیشه
      # از نصبِ تمیز شروع می‌شدند، پس مسیر «به‌روزرسانی روی نصب قبلی» هرگز
      # سنجیده نمی‌شد. کاربری که نسخهٔ قدیمی داشت، ایندکس قدیمی‌اش را نگه
      # می‌داشت و کدِ تازه از جدول‌هایی می‌پرسید که در آن نبودند — هر بازکردن
      # جدول خطای ۵۰۰ می‌داد.
      - name: آزمون به‌روزرسانی روی نصب قبلی
        shell: pwsh
        run: |
          # بدون این، شکستِ یک دستور بومی اسکریپت را متوقف نمی‌کند و آزمون تا پیام
          # موفقیت پیش می‌رود بی‌آنکه چیزی را سنجیده باشد.
          $ErrorActionPreference = "Stop"

          # پوشهٔ دادهٔ مستقل. آزمون قبلاً از جامانده‌های گام نصب استفاده می‌کرد و
          # همان‌جا شکست: هر فرایند یا پویشگری که هنوز kb.sqlite را باز نگه داشته
          # بود، بازسازی ایندکس را می‌خواباند. این‌جا هیچ‌کس جز خودِ آزمون نیست.
          $data = Join-Path $env:RUNNER_TEMP "kavosh-upgrade"
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          $env:KAVOSH_DATA_DIR = $data
          $env:KAVOSH_NO_BROWSER = "1"
          $env:KAVOSH_NO_PAUSE = "1"
          # پورت جدا از گام‌های قبلی: اگر نمونه‌ای از آن‌ها هنوز روی ۸۳۲۱ زنده
          # مانده باشد، آزمون به‌جای برنامهٔ خودش با آن یکی حرف می‌زند و بی‌معنا
          # سبز می‌شود. برای همین هم هر جامانده‌ای اینجا بسته می‌شود.
          Get-Process KavoshDB -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $env:PORT = "8341"
          $exe = "dist\KavoshDB\KavoshDB.exe"
          $log = Join-Path $env:RUNNER_TEMP "upgrade-run.log"

          # برنامه اولین پورت آزاد از پورت دلخواه به بعد را می‌گیرد؛ پس دنبالش
          # می‌گردیم، نه اینکه فرض کنیم دقیقاً روی همان نشسته است.
          function Start-Kavosh($tag) {
              $p = Start-Process -FilePath $exe -PassThru `
                   -RedirectStandardOutput "$log.$tag" -RedirectStandardError "$log.$tag.err"
              $base = $null
              foreach ($i in 1..120) {
                  Start-Sleep -Seconds 2
                  foreach ($port in 8341..8345) {
                      try {
                          Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2 | Out-Null
                          $base = "http://127.0.0.1:$port"; break
                      } catch { }
                  }
                  if ($base -or $p.HasExited) { break }
              }
              if (-not $base) {
                  Write-Host "── خروجی برنامه ($tag) ──"
                  foreach ($f in @("$log.$tag", "$log.$tag.err")) {
                      if (Test-Path $f) { Get-Content $f | Select-Object -Last 40 }
                  }
                  if (-not $p.HasExited) { $p | Stop-Process -Force }
                  throw "برنامه بالا نیامد ($tag)."
              }
              return @{ proc = $p; base = $base }
          }

          # Wait-Process لازم است: Stop-Process فقط دستور کشتن را می‌فرستد و
          # بی‌آنکه صبر کنیم، فایل ایندکس هنوز چند لحظه در دست ویندوز است.
          function Stop-Kavosh($h) {
              if (-not $h.proc.HasExited) { $h.proc | Stop-Process -Force }
              Wait-Process -Id $h.proc.Id -Timeout 30 -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
          }

          # ── ۱) نصب قبلی: یک بار اجرا تا دانش و ایندکس بنشیند ──
          $h = Start-Kavosh "first"
          $body = @{ kind = "table"; payload = @{
              full_name = "HCM3.Employee"; title_fa = "عنوانِ خودِ کاربر" } } | ConvertTo-Json
          Invoke-RestMethod "$($h.base)/api/knowledge" -Method Post -Body $body `
              -ContentType "application/json" | Out-Null
          Stop-Kavosh $h
          Write-Host "  نصب قبلی ساخته شد و دانش کاربر ثبت شد"

          # ── ۲) کهنه کردن: همان چیزی که کاربرِ نسخهٔ قدیمی روی دیسک دارد ──
          $index = Join-Path $data "index\kb.sqlite"
          if (-not (Test-Path $index)) { throw "ایندکس نصب قبلی ساخته نشد." }
          python packaging\age_index.py $index
          if ($LASTEXITCODE -ne 0) { throw "کهنه‌سازی ایندکس شکست خورد." }
          python packaging\age_index.py $index --verify
          if ($LASTEXITCODE -ne 0) { throw "ایندکس کهنه نشد؛ آزمون معتبر نیست." }
          Remove-Item (Join-Path $data "kb-version.txt") -Force -ErrorAction SilentlyContinue

          # ── ۳) اجرای نسخهٔ تازه روی همان پوشه — همان کاری که کاربر کرد ──
          $h = Start-Kavosh "upgrade"
          try {
              foreach ($t in @("FIN3.Voucher", "RPA3.PaymentOrder", "HCM3.Employee")) {
                  $code = (Invoke-WebRequest "$($h.base)/api/table/$t" -UseBasicParsing -TimeoutSec 30).StatusCode
                  if ($code -ne 200) { throw "$t پاسخ $code داد." }
                  Write-Host "  ✔ $t"
              }
              $lookup = Invoke-RestMethod "$($h.base)/api/lookup/EducationDegree" -TimeoutSec 30
              if ($lookup.values.Count -lt 1) { throw "کد و شرحی پس از به‌روزرسانی خالی است." }
              Write-Host "  ✔ کد و شرحی: $($lookup.values.Count) مقدار"

              # به‌روزرسانی نباید دانش کاربر را بشوید
              $emp = Invoke-RestMethod "$($h.base)/api/table/HCM3.Employee" -TimeoutSec 30
              if ($emp.title_fa -ne "عنوانِ خودِ کاربر") {
                  throw "دانش کاربر پس از به‌روزرسانی از بین رفت: $($emp.title_fa)"
              }
              Write-Host "  ✔ دانش کاربر سالم ماند"
          }
          finally { Stop-Kavosh $h }
          Write-Host "به‌روزرسانی روی نصب قبلی — جدول‌ها، کد و شرحی و دانش کاربر سالم"

      - uses: actions/upload-artifact@v4
        with:
          name: KavoshDB-windows
          path: |
            packaging/*.exe
            dist/KavoshDB/

      # مثل گردش‌کار اندروید: آرتیفکت پس از ۹۰ روز پاک می‌شود و برای
      # دانلودش باید وارد گیت‌هاب شد، ولی Release لینک ماندگار می‌دهد.
      #
      # generate_release_notes عمداً خاموش است: هر دو گردش‌کار روی یک برچسب
      # منتشر می‌کنند، و اگر هر دو یادداشت بسازند، دومی آن را به بدنهٔ موجود
      # می‌چسباند و تغییرات دو بار پشت هم دیده می‌شود. تولید یادداشت کارِ
      # گردش‌کار اندروید است؛ این یکی فقط فایل نصبی را اضافه می‌کند.
      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: packaging/*.exe
          generate_release_notes: false
