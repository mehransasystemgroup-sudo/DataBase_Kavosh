# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # وابستگی‌های بک‌اند (sqlglot، yaml و …) برای آزمون‌ها لازم است
        pip install flake8 -r backend/requirements-dev.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check version numbers
      run: python packaging/check_versions.py
    - name: Test with pytest
      run: |
        python -m pytest backend/tests -q

  frontend:
    # آزمون‌های موتور دستیار، مسیرها و نسخهٔ موبایل — همان کدی که در exe و apk می‌رود
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Python deps (ایندکس آزمون با ایندکس‌ساز پایتونی ساخته می‌شود)
      run: pip install -r backend/requirements.txt
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install
      working-directory: frontend
      run: npm ci
    - name: Test
      working-directory: frontend
      run: npx vitest run
    - name: Build
      working-directory: frontend
      run: npx vite build
