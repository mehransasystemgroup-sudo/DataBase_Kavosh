name: ساخت نسخهٔ اندروید

# APK روی رانر لینوکسی گیت‌هاب ساخته می‌شود (اندروید SDK از پیش نصب است) و
# بعد روی شبیه‌ساز واقعی اندروید نصب و اجرا می‌شود؛ پس «ساخته شد» با «کار
# می‌کند» اشتباه گرفته نمی‌شود.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "برچسب انتشار — پرش کنید تا فقط ساخته شود بدون انتشار"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: هم‌خوانی شمارهٔ نسخه در همهٔ جاها
        run: python3 packaging/check_versions.py

      - name: آزمون‌های بک‌اند
        run: |
          pip install -r backend/requirements-dev.txt
          python -m pytest backend/tests -q

      - name: ساخت ایندکس دانش
        working-directory: backend
        run: |
          pip install pyyaml
          python -m core.indexer --kb kb --out ../frontend/public-mobile/kb.sqlite --instance instances/live

      - name: ساخت رابط کاربری موبایل
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      - name: ساخت APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: بازرسی APK
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"

          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          # امضا باید معتبر و شامل طرح v2 باشد، وگرنه اندروید ۱۱ به بعد نصبش نمی‌کند
          "$TOOLS/apksigner" verify --verbose "$APK" | tee /tmp/sign.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sign.txt

          # دارایی‌های حیاتی باید داخل بسته باشند
          unzip -l "$APK" > /tmp/apk.txt
          for entry in assets/index.html assets/kb.sqlite; do
              grep -q "$entry" /tmp/apk.txt || { echo "در APK نیست: $entry"; exit 1; }
          done
          grep -q "assets/assets/.*\.wasm" /tmp/apk.txt || { echo "موتور SQLite در APK نیست"; exit 1; }

          # برنامه باید کاملاً آفلاین باشد: هیچ مجوز سیستمی، به‌ویژه اینترنت.
          #
          # androidx.core خودش یک مجوز خصوصیِ همین برنامه با سطح signature
          # اضافه می‌کند (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) که برای
          # گیرنده‌های داخلی است و هیچ قابلیتی به برنامه نمی‌دهد؛ پس معیار
          # درست «هیچ مجوزی» نیست، «هیچ مجوز سیستمی» است.
          "$TOOLS/aapt2" dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|^application-label:|sdkVersion:|targetSdkVersion:" /tmp/badging.txt
          PERMS=$(grep -oP "uses-permission: name='\K[^']+" /tmp/badging.txt || true)
          echo "مجوزهای اعلام‌شده: ${PERMS:-(هیچ)}"
          SYSTEM_PERMS=$(printf '%s\n' "$PERMS" | grep '^android\.permission\.' || true)
          if [ -n "$SYSTEM_PERMS" ]; then
              echo "مجوز سیستمی خواسته شده، در حالی که برنامه باید کاملاً آفلاین باشد:"
              printf '%s\n' "$SYSTEM_PERMS"
              exit 1
          fi
          echo "بازرسی APK درست بود."

      - name: نگه‌داشتن APK
        uses: actions/upload-artifact@v4
        with:
          name: KavoshDB-android
          path: android/app/build/outputs/apk/release/*.apk

      - name: آزاد کردن فضای دیسک
        run: |
          # شبیه‌ساز برای پارتیشن userdata حدود ۷.۴ گیگابایت می‌خواهد و رانر
          # گیت‌هاب فقط ۷.۳ گیگابایت آزاد دارد؛ اجرای قبلی دقیقاً با همین
          # ۱۱۰ مگابایت کسری افتاد. این ابزارها به این پروژه ربطی ندارند.
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h / | tail -1

      - name: باز کردن دسترسی KVM
        run: |
          # شبیه‌ساز بدون شتاب سخت‌افزاری بالا نمی‌آید و رانر گیت‌هاب به‌طور
          # پیش‌فرض /dev/kvm را در اختیار کاربر بیلد نمی‌گذارد.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: اجرای واقعی روی شبیه‌ساز اندروید
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          # پیش‌فرض این نسخه ۷.۴ گیگابایت است؛ برای اجرای یک برنامهٔ ۵ مگابایتی
          # لازم نیست و فقط دیسک رانر را پر می‌کند.
          disk-size: 4096M
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: نگه‌داشتن تصویر صفحهٔ شبیه‌ساز
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KavoshDB-android-screens
          path: emulator-*.png
          if-no-files-found: ignore

      - name: بررسی ایستا (lint)
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease

      # آرتیفکت گردش‌کار پس از ۹۰ روز پاک می‌شود و برای دانلودش باید وارد
      # گیت‌هاب شد. Release لینک ماندگار و مستقیم می‌دهد — پس اجرای دستی هم
      # اگر برچسب بگیرد منتشر می‌کند، نه فقط push روی تگ.
      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
