# کلید امضای نسخهٔ داخلی.
#
# این کلید عمداً داخل مخزن است تا هر ساختی — روی هر ماشینی — همان امضا را
# بدهد و نسخهٔ جدید روی نسخهٔ نصب‌شدهٔ قبلی بنشیند (اندروید نصب روی امضای
# متفاوت را رد می‌کند). چون رمزش این‌جاست، هیچ ادعای امنیتی ندارد و فقط
# برای توزیع داخلی است. برای انتشار عمومی، کلید تازه بسازید و این فایل را
# با رمز واقعی و خارج از مخزن جایگزین کنید:
#
#   keytool -genkeypair -keystore my.jks -alias kavosh -keyalg RSA -keysize 4096 -validity 10950
storeFile=keystore/kavosh.jks
storePassword=kavosh-internal
keyAlias=kavosh
keyPassword=kavosh-internal
