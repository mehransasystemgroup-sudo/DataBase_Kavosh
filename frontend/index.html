<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050806" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F8F5" media="(prefers-color-scheme: light)" />
    <meta name="description" content="کاوشگر پایگاه داده — جست‌وجو در ساختار، ستون‌ها و روابط جدول‌های نرم‌افزار سازمانی" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>کاوشگر پایگاه داده</title>
    <script>
      // تم را پیش از اولین رنگ‌آمیزی اعمال می‌کنیم تا صفحه سفیدی/سیاهی
      // ناگهانی نزند. همان کلیدی که ThemeContext می‌نویسد خوانده می‌شود.
      (function () {
        try {
          var saved = localStorage.getItem("dbk_theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>برای اجرای این برنامه باید جاوااسکریپت را فعال کنید.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
