# جدول‌های کد و شرحی — SYS3.Lookup و SYS3.LookupInfo
#
# فیلدهایی که کاربر در فرم‌های نرم‌افزار از میان مقادیر از پیش تعریف‌شده
# انتخاب می‌کند (مثلاً «مقطع تحصیلی» در فرم کارمند). مقدار ذخیره‌شده در
# پایگاه داده همان code است و value چیزی است که کاربر می‌بیند.
#
# منبع: صادرات کاربر — SYS3.Lookup (اکسل) و SYS3.LookupInfo (PDF).
#
# ⚠️ ترمیم داده: در صادرات اکسل حرف «ی» (U+06CC) به «?» تبدیل شده بود —
# در ۷۳۹۹ مقدار، «ی» صفر بار و «?» ۶۶۶۴ بار دیده شد. جایگزینی با آزمون
# تفکیکی روی پیکرهٔ مستقلِ عنوان‌های PDF و پایگاه دانش سنجیده شد: «ی»
# 4190 واژهٔ درست ساخت و نزدیک‌ترین نامزد بعدی ۸۹ تا. 4255 مقدار ترمیم شد.
#
# عنوان فارسی نوع‌ها از SYS3.LookupInfo می‌آید؛ 879
# نوع از 1830 نوع عنوان دارند و بقیه با نام لاتین خودشان می‌آیند.
#
# تاریخ ورود: 2026-09-09
