# واژه‌نامهٔ اجزای نام ستون — برای ساختن نام فارسی ستون‌هایی که در هیچ مستندی نیامده‌اند.
#
# نام ستون به اجزایش شکسته می‌شود (ConfirmDate → Confirm + Date) و هر جزء از این
# فهرست (یا از عنوان رسمی جدول‌ها و کد و شرحی‌ها) معنا می‌گیرد؛ بعد به ترتیب
# فارسی چیده می‌شود («تاریخ تأیید»). اگر حتی یک جزء ناشناخته باشد، نامی ساخته
# نمی‌شود — نام ناقص یا حدسی بدتر از نبودِ نام است.
#
# شکل هر ورودی:
#   واژه: معادل                      اسم یا صفتی که پس از هسته می‌آید (مثل «نهایی»)
#   واژه: {fa: معادل, pre: true}     پیش از بقیه می‌آید (حداکثر، اولین، …)
#   واژه: {fa: معادل, pred: true}    اگر آخرِ نام باشد سر جایش می‌ماند («ایجاد شده»)
# صفت‌هایی که در فهرست adjectives آمده‌اند اگر آخرِ نام بیایند پس از اسم
# می‌نشینند (LabourFeeActual ← «نرخ دستمزد واقعی»).
# بخش phrases برای ترکیب‌هایی است که معنای جدا دارند (by product ← محصول جانبی).
#
# این نام‌ها با source: composed علامت می‌خورند و در اپ «نام پیشنهادی» نمایش داده
# می‌شوند. هر نامی که در _columns.yaml یا _table_columns.yaml ثبت شود بر این‌ها
# اولویت دارد.
