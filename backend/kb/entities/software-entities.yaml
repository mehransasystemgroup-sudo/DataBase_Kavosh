# موجودیت‌های نرم‌افزار — «فرم اطلاعات موجودیت‌ها»، صادرات کاربر.
#
# عنوان رسمی هر موجودیت در خودِ نرم‌افزار، به‌همراه ماژولی که به آن تعلق دارد
# (مثل HCM.Staff یا ECM.DocumentManagement). این ماژول‌ها بخش‌بندی نرم‌افزارند،
# نه اسکیمای پایگاه داده، و محورِ دیگری برای فهمیدن ساختارند.
#
# تطبیق با جدول‌ها بر پایهٔ نام موجودیت انجام شده، ولی فقط وقتی اسکیمای جدول با
# ماژول موجودیت بخواند — وگرنه نام‌های تکراری بین ماژول‌ها اشتباه وصل می‌شوند.
# مثال واقعی: دو موجودیت به نام Position وجود دارد، یکی «نماینده شرکت» در
# ECM.PositionManagement و دیگری «سمت» در مدل‌سازی سازمانی؛ بدون شرط ماژول،
# هر دو به یک جدول می‌چسبیدند.
#
# 1658 موجودیت با عنوان فارسی (310 ردیف عنوان ترجمه‌نشده داشتند و
# کنار گذاشته شدند) · 1399 جدول منطبق.
#
# تاریخ ورود: 2026-09-09
